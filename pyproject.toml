[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cucu"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "eth-account>=0.11",
    "py-clob-client>=0.17",
    "rich>=13",
    "typer>=0.12",
    "apscheduler>=3.10",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.scripts]
cucu = "agent.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
